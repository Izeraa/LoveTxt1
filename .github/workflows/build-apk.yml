name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build loveTxt APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies & build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            mv /tmp/cmdline-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor & sync Android project
        run: |
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -d "android" ]; then
            ./node_modules/.bin/cap add android
          fi
          ./node_modules/.bin/cap sync android

      - name: Apply loveTxt app icon and splash screen
        run: |
          python3 -c "import PIL" 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
          python3 - << 'EOF'
          import glob
          import os
          from PIL import Image

          candidates = [
              "public/lovetxt-icon.png",
              "public/assets/aistudio/_cone_Neon_LoveTxt_a4c65811.png",
          ]
          src_path = next((p for p in candidates if os.path.exists(p)), None)
          res_dir = "android/app/src/main/res"

          if not src_path:
              print("Icon source not found, keeping default Android icon.")
              raise SystemExit(0)

          img = Image.open(src_path).convert("RGBA")
          w, h = img.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          icon_square = img.crop((left, top, left + side, top + side))

          mipmap_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in mipmap_sizes.items():
              target_dir = os.path.join(res_dir, folder)
              if not os.path.isdir(target_dir):
                  continue
              resized = icon_square.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, "ic_launcher.png"))
              resized.save(os.path.join(target_dir, "ic_launcher_round.png"))

              fg_size = int(size * 2.25)
              fg_canvas = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
              inner = int(fg_size * 0.68)
              fg_icon = icon_square.resize((inner, inner), Image.Resampling.LANCZOS)
              offset = (fg_size - inner) // 2
              fg_canvas.paste(fg_icon, (offset, offset), fg_icon)
              fg_canvas.save(os.path.join(target_dir, "ic_launcher_foreground.png"))

          for splash_path in glob.glob(os.path.join(res_dir, "drawable*", "splash.png")):
              with Image.open(splash_path) as existing:
                  sw, sh = existing.size
              splash = Image.new("RGBA", (sw, sh), (20, 20, 22, 255))
              icon_dim = max(120, int(min(sw, sh) * 0.38))
              splash_icon = icon_square.resize((icon_dim, icon_dim), Image.Resampling.LANCZOS)
              splash.paste(splash_icon, ((sw - icon_dim) // 2, (sh - icon_dim) // 2), splash_icon)
              splash.save(splash_path)

          bg_xml = os.path.join(res_dir, "values", "ic_launcher_background.xml")
          if os.path.exists(bg_xml):
              with open(bg_xml, "w", encoding="utf-8") as f:
                  f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#141416</color>\n</resources>\n')
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../loveTxt.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loveTxt-apk
          path: loveTxt.apk

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: loveTxt APK ${{ steps.tag.outputs.tag }}
          files: loveTxt.apk
          generate_release_notes: true
