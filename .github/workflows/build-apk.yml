name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build loveTxt APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Assets CLI
        run: npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3

      - name: Add and sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android app icon and splash from loveTxt image
        run: |
          python3 -c "import PIL" 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-pil)
          python3 - << 'EOF'
          import os
          from PIL import Image

          src_path = "public/assets/aistudio/_cone_Neon_LoveTxt_a4c65811.png"
          os.makedirs("assets", exist_ok=True)

          img = Image.open(src_path).convert("RGBA")
          w, h = img.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          cropped = img.crop((left, top, left + side, top + side))

          icon = cropped.resize((1024, 1024), Image.Resampling.LANCZOS)
          icon.save("assets/icon-only.png")
          icon.save("assets/icon-foreground.png")

          bg = Image.new("RGBA", (1024, 1024), (20, 20, 22, 255))
          bg.save("assets/icon-background.png")

          splash = Image.new("RGBA", (2732, 2732), (20, 20, 22, 255))
          splash_icon = cropped.resize((840, 840), Image.Resampling.LANCZOS)
          offset = (2732 - 840) // 2
          splash.paste(splash_icon, (offset, offset), splash_icon)
          splash.save("assets/splash.png")
          EOF
          ./node_modules/.bin/capacitor-assets generate --android --iconBackgroundColor '#141416' --splashBackgroundColor '#141416'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../loveTxt.apk

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: loveTxt ${{ steps.tag.outputs.tag }}
          files: loveTxt.apk
          generate_release_notes: true
